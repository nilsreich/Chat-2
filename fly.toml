# fly.toml app configuration file generated for chat-2 on 2026-09-04T18:58:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chat-2'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  DATABASE_PATH = '/data/noten.db'
  PORT = '8080'
  TZ = 'Europe/Berlin'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '2s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
