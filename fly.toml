app = "noten-gradebook"
primary_region = "fra"
[build]
  dockerfile = "Dockerfile"
[env]
  PORT = "8080"
  DATABASE_PATH = "/data/noten.db"
  APP_ENV = "production"
  TZ = "Europe/Berlin"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "2s"
    path = "/healthz"
[[mounts]]
  source = "data"
  destination = "/data"
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
